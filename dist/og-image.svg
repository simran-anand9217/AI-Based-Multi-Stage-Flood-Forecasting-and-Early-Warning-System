<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040810" />
      <stop offset="50%" stop-color="#070e1c" />
      <stop offset="100%" stop-color="#0c172e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#040810" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="250" y1="0" x2="250" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="550" y1="0" x2="550" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="850" y1="0" x2="850" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Wave Radar Concentric Circles -->
  <g stroke="#38bdf8" opacity="0.2" fill="none">
    <circle cx="1020" cy="315" r="100" stroke-width="1.5" />
    <circle cx="1020" cy="315" r="180" stroke-width="1.5" stroke-dasharray="8 6" />
    <circle cx="1020" cy="315" r="260" stroke-width="1.5" />
    <circle cx="1020" cy="315" r="340" stroke-width="1.5" stroke-dasharray="4 8" />
  </g>

  <!-- Top Badges -->
  <g transform="translate(80, 80)">
    <!-- Category Badge -->
    <rect width="260" height="36" rx="18" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <text x="130" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">CYBER-SECURITY MINI PROJECT</text>

    <!-- Version Badge -->
    <rect x="275" width="130" height="36" rx="18" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    <text x="340" y="23" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#34d399" text-anchor="middle" letter-spacing="1">LIVE v1.0.0</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 190)">
    <text font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="64" fill="#ffffff" letter-spacing="-1">
      HYDRO<tspan fill="#38bdf8">AI</tspan> GUARD
    </text>
    <text y="70" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="32" fill="#94a3b8" letter-spacing="-0.5">
      AI-Based Multi-Stage Flood Forecasting
    </text>
    <text y="115" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="28" fill="#38bdf8">
      &amp; Early Warning System
    </text>

    <!-- Description -->
    <text y="180" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="20" fill="#cbd5e1" opacity="0.9">
      Physical-AI Pipeline: Rainfall &amp; Water-Level Forecasting, Hydrodynamic Velocity
    </text>
    <text y="212" font-family="'Inter', system-ui, sans-serif" font-weight="400" font-size="20" fill="#cbd5e1" opacity="0.9">
      Analysis, Leaflet GIS Inundation Mapping, and HMAC Sensor Integrity Layer.
    </text>
  </g>

  <!-- Bottom Details & Academic Institution -->
  <g transform="translate(80, 500)">
    <line x1="0" y1="0" x2="1040" y2="0" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <text y="40" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">
      Intelligent Hydrological Forecasting &amp; Geospatial Warning Platform
    </text>
    <text y="68" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="14" fill="#64748b">
      Project Team: Swati Basliyal • Simran Anand • Ravina Ranjan | Supervisor: Ms. Arzoo Sorout
    </text>

    <!-- Tech Stack Pill Tags -->
    <g transform="translate(760, 20)">
      <rect width="80" height="30" rx="6" fill="#112040" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="40" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">React 18</text>
      
      <rect x="90" width="65" height="30" rx="6" fill="#112040" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="122" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">Vite 6</text>

      <rect x="165" width="115" height="30" rx="6" fill="#112040" stroke="rgba(56, 189, 248, 0.3)" />
      <text x="222" y="20" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" text-anchor="middle">Leaflet GIS</text>
    </g>
  </g>
</svg>
